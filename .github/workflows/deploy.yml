name: Deploy with secret

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Create secret.js from GitHub Secret
        run: |
          echo "// Секрет из GitHub" > secret.js
          echo "const CORRECT_PASSWORD = '${{ secrets.SECRET_PASSWORD }}';" >> secret.js
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
