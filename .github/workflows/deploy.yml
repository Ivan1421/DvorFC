name: Deploy Site

on:
  push:
    branches: [ main ] # или master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Заменяем __API_KEY__ в index.html на реальный секрет
      - name: Inject API Key
        env:
          SECRET_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          sed -i "s/__API_KEY__/${SECRET_KEY}/g" index.html

      # Пример публикации готового сайта на GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
