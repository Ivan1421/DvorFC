    <!-- Supabase initialization: single safe client instance
         IMPORTANT: do NOT put secret service role keys in client-side code.
         If you had a secret key in the repo or client, revoke it immediately in Supabase dashboard.
    -->
    <script>
      (function(){
        try {
          const SUPABASE_URL = 'https://pgcdeufbvdricaccjpls.supabase.co';
          const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_8Tf6g3Uvv4d2f3kewhAVUQ_CoIZ5qxp';
          // Create or reuse a global client to avoid redeclaration errors
          if (!window.supabaseClient) {
            window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
          }
          // Local convenient alias
          window.sb = window.supabaseClient;
        } catch (e) {
          // If SDK not loaded or other error, fail gracefully
          console.error('Supabase init error:', e);
        }
      })();
    </script>
